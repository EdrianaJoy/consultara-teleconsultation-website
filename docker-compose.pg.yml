version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: consultara
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    image: consultara-web:latest
    depends_on:
      - db
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/consultara
      ENABLE_PG_ADAPTER: 'true'
      PG_MAX_POOL_SIZE: 10
    ports:
      - "3001:3000"
    volumes:
      - ./public:/app/public:ro
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
